name: split_it
description: Split expenses with friends and groups. Track balances, simplify debts, and settle up easily.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Authentication - will use HMS for AppGallery production
  # firebase_auth: ^4.15.3
  # firebase_core: ^2.24.2
  
  # Huawei Mobile Services (HMS) - Ready for AppGallery
  # agconnect_auth: ^1.8.0+300
  # huawei_account: ^6.11.0+300
  # agconnect_clouddb: ^1.8.0+300
  # Add these later when needed:
  # agconnect_cloudstorage: ^1.9.0+300
  # huawei_push: ^6.12.0+300
  # huawei_ml_text: ^3.12.0+300

  # Routing
  go_router: ^13.1.0

  # UI & Theme
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Charts
  fl_chart: ^0.66.2

  # Image & Camera (disabled until needed)
  # image_picker: ^1.0.7
  # image_cropper: ^5.0.1

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Security
  local_auth: ^2.1.8
  flutter_secure_storage: ^9.0.0

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  equatable: ^2.0.5
  collection: ^1.18.0

  # Icons
  cupertino_icons: ^1.0.6
  phosphor_flutter: ^2.0.1
  # HMS plugins moved to commented section above - will re-enable for AppGallery production

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
